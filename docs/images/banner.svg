<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Simulador de PBQs Security+ SY0-701">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.55" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#062a3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.08" cy="0.95" r="0.45">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e3a5f" stroke-width="1" opacity="0.45"/>
    </pattern>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <rect width="1280" height="420" fill="url(#glow)"/>
  <rect width="1280" height="420" fill="url(#glow2)"/>

  <!-- Left: identity -->
  <g transform="translate(72 74)">
    <path d="M34 0 66 12v26c0 22-14 38-32 46C16 76 2 60 2 38V12z" fill="url(#shield)"/>
    <path d="M20 41l10 10 18-22" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="90" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#67e8f9" letter-spacing="3">PERFORMANCE-BASED QUESTIONS</text>
    <text x="90" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#f8fafc">Security+ <tspan fill="#22d3ee" font-family="Consolas, 'Courier New', monospace">SY0-701</tspan></text>
  </g>
  <text x="72" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#f8fafc">Simulador de PBQs</text>
  <text x="72" y="256" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#cbd5e1">Practica las preguntas prácticas del examen, como en el día real.</text>

  <!-- Chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600">
    <rect x="72" y="292" width="122" height="38" rx="19" fill="#0e7490" fill-opacity="0.35" stroke="#22d3ee" stroke-opacity="0.6"/>
    <text x="133" y="317" text-anchor="middle" fill="#a5f3fc">61 PBQs</text>
    <rect x="206" y="292" width="148" height="38" rx="19" fill="#0e7490" fill-opacity="0.35" stroke="#22d3ee" stroke-opacity="0.6"/>
    <text x="280" y="317" text-anchor="middle" fill="#a5f3fc">5 dominios</text>
    <rect x="366" y="292" width="200" height="38" rx="19" fill="#065f46" fill-opacity="0.4" stroke="#34d399" stroke-opacity="0.6"/>
    <text x="466" y="317" text-anchor="middle" fill="#a7f3d0">Simulacros con tiempo</text>
    <rect x="578" y="292" width="178" height="38" rx="19" fill="#3730a3" fill-opacity="0.35" stroke="#818cf8" stroke-opacity="0.6"/>
    <text x="667" y="317" text-anchor="middle" fill="#c7d2fe">Guía de estudio</text>
  </g>
  <text x="72" y="372" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#64748b">Gratis · Sin registro · En español</text>

  <!-- Right: firewall rule table mock -->
  <g transform="translate(812 56)" filter="url(#soft)">
    <rect width="400" height="168" rx="14" fill="#0f172a" stroke="#1e293b"/>
    <rect width="400" height="34" rx="14" fill="#111c33"/>
    <rect y="20" width="400" height="14" fill="#111c33"/>
    <circle cx="20" cy="17" r="5" fill="#f43f5e"/><circle cx="37" cy="17" r="5" fill="#f59e0b"/><circle cx="54" cy="17" r="5" fill="#10b981"/>
    <text x="76" y="22" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#94a3b8">firewall-acl · first-match</text>
    <g font-family="Consolas, 'Courier New', monospace" font-size="14">
      <rect x="14" y="48" width="70" height="24" rx="6" fill="#064e3b"/><text x="49" y="65" text-anchor="middle" fill="#6ee7b7">PERMIT</text>
      <text x="96" y="65" fill="#e2e8f0">TCP any → 172.16.10.10:443</text>
      <rect x="14" y="80" width="70" height="24" rx="6" fill="#064e3b"/><text x="49" y="97" text-anchor="middle" fill="#6ee7b7">PERMIT</text>
      <text x="96" y="97" fill="#e2e8f0">TCP 172.16.10.10 → db:5432</text>
      <rect x="14" y="112" width="70" height="24" rx="6" fill="#4c0519"/><text x="49" y="129" text-anchor="middle" fill="#fda4af">DENY</text>
      <text x="96" y="129" fill="#e2e8f0">ANY DMZ → LAN</text>
      <text x="96" y="156" fill="#64748b">DENY ANY ANY (implícita)</text>
    </g>
  </g>

  <!-- Right: terminal mock -->
  <g transform="translate(796 246)" filter="url(#soft)">
    <rect width="278" height="128" rx="14" fill="#020617" stroke="#1e293b"/>
    <g font-family="Consolas, 'Courier New', monospace" font-size="14">
      <text x="18" y="32" fill="#34d399">$ <tspan fill="#e2e8f0">chmod 2770 /srv/proyectos</tspan></text>
      <text x="18" y="58" fill="#34d399">$ <tspan fill="#e2e8f0">ls -ld /srv/proyectos</tspan></text>
      <text x="18" y="84" fill="#67e8f9">drwxrws--- root ingenieria</text>
      <text x="18" y="110" fill="#34d399">$ <tspan fill="#e2e8f0">find / -perm -4000</tspan><tspan fill="#22d3ee">▌</tspan></text>
    </g>
  </g>

  <!-- Right: network diagram mock -->
  <g transform="translate(1090 252)" filter="url(#soft)">
    <rect width="122" height="120" rx="14" fill="#0f172a" stroke="#1e293b"/>
    <g stroke="#22d3ee" stroke-opacity="0.55" stroke-width="2">
      <line x1="61" y1="28" x2="27" y2="70"/><line x1="61" y1="28" x2="95" y2="70"/><line x1="27" y1="70" x2="61" y2="100"/><line x1="95" y1="70" x2="61" y2="100"/>
    </g>
    <circle cx="61" cy="28" r="11" fill="#0891b2"/>
    <circle cx="27" cy="70" r="10" fill="#10b981"/>
    <circle cx="95" cy="70" r="10" fill="#6366f1"/>
    <circle cx="61" cy="100" r="10" fill="#f59e0b"/>
    <text x="61" y="33" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff">WAF</text>
  </g>
</svg>
